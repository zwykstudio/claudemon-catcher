[project]
name = "claudemon-catcher"
version = "0.2.7"
description = "Catch spinner words from Claude Code"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "E741",   # ambiguous variable name (l, O) — too noisy for short lambdas/loops
]

[tool.ruff.lint.isort]
known-first-party = ["engine", "cli", "mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
